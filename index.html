<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>[YOUR MARK]™ — hero</title>
<meta name="description" content="Fullscreen energy-machine hero scene."/>
<!-- coarse-pointer devices get the 1024 desktop composition, scaled down -->
<script>if(matchMedia('(pointer: coarse)').matches){var v=document.querySelector('meta[name=viewport]');if(v)v.setAttribute('content','width=1024, user-scalable=no, viewport-fit=cover');}</script>
<link rel="stylesheet" href="css/hero.css"/>
</head>
<body id="top">

<!-- ===================== SCALED PAGE (the hero itself) =====================
     Fullbleed 3D canvas, nothing overlaid. The fixed chrome layer, the minimap,
     the stamp and the night-vision toggle were all removed; js/chrome.js keeps
     only the 1024px design-canvas scaling. -->
<div id="page">
  <div id="scene3d">
    <div id="preloader"><div class="ring"></div></div>
  </div>

  <!-- ===================== SECTION 2 — the holographic tree =====================
       Same 1024px design canvas, stacked directly under the hero. Its own WebGL
       context in js/tree.js: the two scenes share no state, and each pauses its
       loop when it scrolls out of view. -->
  <div id="scene3d2">
    <div id="preloader2"><div class="ring"></div></div>
  </div>

  <!-- ===================== SECTION 3 — the neon screen display =====================
       Third stacked section, same design canvas. Unlike the tree, this model has
       real flat display faces, so js/neon.js cuts the video surfaces out of the
       mesh the way the hero does rather than placing them. -->
  <div id="scene3d3">
    <div id="preloader3"><div class="ring"></div></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>
<script>
/* Finals dropped into /assets-final/ are picked up automatically; the screen
   loops still fall back to stock and then to the local procedural clips. The
   rig itself no longer has a fallback — a missing GLB is a loud console error. */
window.HERO_ASSETS = {
  model:   'assets-final/hero-rig.glb',
  screens: ['screen-a.mp4','screen-b.mp4','screen-c.mp4','screen-d.mp4'],
  /* flip to true once real screen finals are dropped into assets-final/ —
     until then the loader skips that step instead of 404ing four times */
  finalScreens: false,
  /* Screen footage until finals land: free Pexels stock (Pexels licence — free
     to use, no attribution required). CORS-enabled, which a WebGL video texture
     requires. 1280x720, not the 640x360 SD cuts — at DPR 2 a display face is
     ~800 device px wide and SD footage visibly pixelates on it.
     Swap any URL freely; each falls back to its local loop offline. */
  stock: [
    'https://videos.pexels.com/video-files/3576378/3576378-hd_1280_720_25fps.mp4',
    'https://videos.pexels.com/video-files/2098989/2098989-hd_1280_720_30fps.mp4',
    'https://videos.pexels.com/video-files/2278095/2278095-hd_1280_720_30fps.mp4',
    'https://videos.pexels.com/video-files/1851190/1851190-hd_1280_720_25fps.mp4'
  ],
  screenGrade: 1,          /* 1 = graded onto the §2 green tiers, 0 = raw footage colour */
  finalDir: 'assets-final/',
  placeholderDir: 'placeholders/'
};

/* Section 2. The tree is the same kind of asset as the rig — a Tripo export,
   one node, one mesh, one material, three maps — so it runs through the same
   pipeline and carries the same degenerate metallic-roughness map.
   Its four pods get a clip each, drawn at RANDOM from the pool below on every
   load, so the section is not the same four videos every time. */
window.TREE_ASSETS = {
  model: 'assets-final/holographic-tree.glb',
  /* shuffled per load; falls back to the local procedural loops offline */
  stock: [
    'https://videos.pexels.com/video-files/3576378/3576378-hd_1280_720_25fps.mp4',
    'https://videos.pexels.com/video-files/2098989/2098989-hd_1280_720_30fps.mp4',
    'https://videos.pexels.com/video-files/2278095/2278095-hd_1280_720_30fps.mp4',
    'https://videos.pexels.com/video-files/1851190/1851190-hd_1280_720_25fps.mp4'
  ],
  placeholders: ['screen-a.mp4','screen-b.mp4','screen-c.mp4','screen-d.mp4'],
  placeholderDir: 'placeholders/',
  screenGrade: 1
};

/* Section 3. Six panels, and unlike the tree they are real flat faces, so the
   video geometry is cut from the mesh. Same shuffled pool — with six screens to
   fill, the local loops in the pool matter more here than anywhere. */
window.NEON_ASSETS = {
  model: 'assets-final/neon-screens.glb',
  stock: [
    'https://videos.pexels.com/video-files/3576378/3576378-hd_1280_720_25fps.mp4',
    'https://videos.pexels.com/video-files/2098989/2098989-hd_1280_720_30fps.mp4',
    'https://videos.pexels.com/video-files/2278095/2278095-hd_1280_720_30fps.mp4',
    'https://videos.pexels.com/video-files/1851190/1851190-hd_1280_720_25fps.mp4'
  ],
  placeholders: ['screen-a.mp4','screen-b.mp4','screen-c.mp4','screen-d.mp4'],
  placeholderDir: 'placeholders/',
  screenGrade: 1
};
</script>
<script src="js/chrome.js"></script>
<script type="module" src="js/hero.js"></script>
<script type="module" src="js/tree.js"></script>
<script type="module" src="js/neon.js"></script>
</body>
</html>
